<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUBTERRA</title>
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="grain"></div>

<div class="bg-fill" id="bgFill">
  <div class="bg-watermark"></div>
  <div class="bg-stripes"></div>
</div>

<nav id="nav">
  <div class="nav-brand">
    <img src="assets/logo-mark.png" alt="">
    <span class="nav-mark">SUBTERRA</span>
  </div>
</nav>

<section class="stage-wrap" id="stageWrap">
  <div class="stage">

        <div class="logo-stage" id="logoStage">
      <div class="flip-perspective" id="flipPerspective">
        <div class="flip-inner" id="flipInner">
          <div class="flip-face front"><img src="assets/logo-mark.png" alt="SUBTERRA"></div>
          <div class="flip-face back"><img src="assets/logo-full.png" alt="SUBTERRA"></div>
        </div>
      </div>
      <p class="logo-tagline" id="logoTagline">UN CYPHER DE SUBTERRA.</p>
      <div class="scroll-cue" id="scrollCue">
        <div class="scroll-cue-line"></div>
        <div class="scroll-cue-label">SIGUE DESLIZANDO</div>
      </div>
    </div>

        <div class="trailer-stage" id="trailerStage">
      <div class="trailer-bg-glow"></div>
      <div class="trailer-kicker">TRAILER</div>
      <div class="trailer-video-frame" id="trailerFrame">
          <video
              id="trailerVideo"
              playsinline
              preload="metadata"
          >
              <source
                  src="https://github.com/Juancamilo3821/subterraCypher/releases/download/trailer-v1/Trailer-Subterra.mp4"
                  type="video/mp4"
              >
              Tu navegador no soporta video HTML5.
          </video>
          <div class="trailer-play" id="trailerPlay" role="button" aria-label="Reproducir o pausar el trailer">
            <svg viewBox="0 0 24 24" fill="none"><path id="trailerPlayIcon" d="M6 4L20 12L6 20V4Z" fill="#ffffff"/></svg>
          </div>

          <div class="trailer-controls" id="trailerControls">
            <button class="tc-btn" id="tcPlay" aria-label="Reproducir o pausar">
              <svg viewBox="0 0 24 24"><path id="tcPlayIcon" d="M6 4L20 12L6 20V4Z" fill="#ffffff"/></svg>
            </button>

            <span class="tc-time" id="tcTime">0:00 / 0:00</span>

            <div class="tc-progress" id="tcProgress">
              <div class="tc-progress-fill" id="tcProgressFill"></div>
            </div>

            <button class="tc-btn" id="tcMute" aria-label="Silenciar o activar sonido">
              <svg viewBox="0 0 24 24" id="tcMuteIcon" fill="#ffffff">
                <path d="M4 9v6h4l5 5V4L8 9H4z"/>
                <path id="tcMuteWave1" d="M16.5 12c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24z"/>
                <path id="tcMuteWave2" d="M14.5 4.97v2.06c2.89 1.22 4.5 4.02 4.5 7.97s-1.61 6.75-4.5 7.97v2.06c4-1.27 6.5-4.85 6.5-9.03 0-4.18-2.5-7.76-6.5-9.03z" style="display:none"/>
                <path id="tcMuteX" d="M19.5 12l2.5-2.5-1.5-1.5-2.5 2.5-2.5-2.5-1.5 1.5 2.5 2.5-2.5 2.5 1.5 1.5 2.5-2.5 2.5 2.5 1.5-1.5z" style="display:none"/>
              </svg>
            </button>
          </div>
      </div>
      <h2>SUBTERRA CYPHER.</h2>
      <div class="event-date" id="eventDate">25 / 09 / 2026</div>
    </div>

  </div>
</section>

<section class="bts-section" id="btsSection">
  <div class="bts-heading">
    <div class="bts-kicker">DETRAS DE SUBTERRA</div>
    <h2>BEHIND THE SUBTERRA CYPHER.</h2>
    <p>Un vistazo al proceso, la energía y las personas detrás del proyecto.</p>
  </div>

  <div class="bts-mosaic">
    <button class="bts-video-tile" id="btsVideoOpen" type="button" aria-label="Abrir video del detrás de cámaras">
      <span class="bts-video-poster" aria-hidden="true">
        <img src="assets/bts/BANNER SUBTERRA WHITE.png" alt="">
      </span>
      <span class="bts-tile-shade"></span>
      <span class="bts-tile-play" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M8 5L19 12L8 19V5Z" fill="currentColor"/></svg>
      </span>
      <span class="bts-tile-label">VER BTS</span>
    </button>

    <figure class="bts-photo">
      <img src="assets/logo-mark.png" alt="Logo símbolo de Subterra">
    </figure>
    <figure class="bts-photo">
      <img src="assets/bts/creditos new black V1.png" alt="Créditos de Subterra">
    </figure>
  </div>
</section>

<div class="bts-modal" id="btsModal" aria-hidden="true">
  <div class="bts-modal-backdrop" data-bts-close></div>
  <div class="bts-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="btsModalTitle">
    <div class="bts-modal-header">
      <span id="btsModalTitle">BEHIND THE CYPHER.</span>
      <button class="bts-modal-close" type="button" data-bts-close aria-label="Cerrar video">&times;</button>
    </div>
    <div class="trailer-video-frame bts-modal-frame" id="btsFrame">
      <video id="btsVideo" src="assets/bts/Shayfersaurio BTS.mp4" data-src="assets/bts/Shayfersaurio BTS.mp4" poster="assets/bts/BANNER SUBTERRA WHITE.png" playsinline preload="none">
        Tu navegador no soporta video HTML5.
      </video>
      <button class="trailer-play" id="btsPlay" type="button" aria-label="Reproducir o pausar el BTS">
        <svg viewBox="0 0 24 24" fill="none"><path id="btsPlayIcon" d="M6 4L20 12L6 20V4Z" fill="#ffffff"/></svg>
      </button>
      <div class="trailer-controls" id="btsControls">
        <button class="tc-btn" id="btsTcPlay" type="button" aria-label="Reproducir o pausar">
          <svg viewBox="0 0 24 24"><path id="btsTcPlayIcon" d="M6 4L20 12L6 20V4Z" fill="#ffffff"/></svg>
        </button>
        <span class="tc-time" id="btsTcTime">0:00 / 0:00</span>
        <div class="tc-progress" id="btsTcProgress" role="slider" aria-label="Progreso del video">
          <div class="tc-progress-fill" id="btsTcProgressFill"></div>
        </div>
        <button class="tc-btn" id="btsTcMute" type="button" aria-label="Silenciar o activar sonido">
          <svg viewBox="0 0 24 24" fill="#ffffff"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path id="btsTcMuteWave" d="M16.5 12c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24z"/><path id="btsTcMuteX" d="M19.5 12l2.5-2.5-1.5-1.5-2.5 2.5-2.5-2.5-1.5 1.5 2.5 2.5 2.5 2.5 1.5-1.5z" style="display:none"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<footer id="footer">
  <div class="footer-mark">SUBTERRA</div>
  <div class="footer-ig-grid">
    <a href="https://instagram.com/1subterra" target="_blank" rel="noopener">@1subterra</a>
  </div>
</footer>

<script src="js/main.js" defer></script>

</body>
</html>
